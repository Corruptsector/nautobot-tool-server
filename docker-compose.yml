services:
  nautobot-tool-server:
    image: networktocode/nautobot:2.3-py3.11
    entrypoint: ["python"]
    command: ["/app/server.py"]
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./server.py:/app/server.py:ro
    environment:
      NAUTOBOT_URL: ${NAUTOBOT_URL:-http://nautobot:8080}
      NAUTOBOT_TOKEN: ${NAUTOBOT_TOKEN:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      PORT: "${PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
